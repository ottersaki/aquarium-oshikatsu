 header::after {

.otter img {

/* 上のゆるい波 */

    100% 35%,

    40% 42%,
    30% 65%,
    20% 72%,
    10% 55%,
    0 38%

}

/* 下のゆるい波 */

  content: "";

  z-index: 2;
  bottom: -1px;
  left: 0;
  width: 100%;
  height: 32px;
  background-color: #8bd8e3;

    0 62%,
    10% 45%,
    20% 28%,
    30% 35%,
    40% 58%,
    50% 70%,
    60% 62%,
    70% 42%,
    80% 30%,
    90% 45%,
    100% 65%,

<main>

  <section class="card">

  <section class="card">
    <h2>📖 思い出アルバム</h2>
   
<div id="calendarArea">

  </div>

  <div id="calendar"></div>
</div>
   
   <button onclick="testLoadFirestore()">☁️ クラウドの海をのぞいてみる 🦦</button>
    <div id="records"></div>

<script>
 
let calendarDate = new Date();

function drawCalendar(records = []) {
  const calendar = document.getElementById("calendar");
  const title = document.getElementById("calendarTitle");

  const year = calendarDate.getFullYear();
  const month = calendarDate.getMonth();

  title.textContent = `${year}年${month + 1}月`;

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();

  let html = `
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;">
      <div>日</div><div>月</div><div>火</div><div>水</div>
      <div>木</div><div>金</div><div>土</div>
  `;

  for (let i = 0; i < firstDay; i++) {
    html += `<div></div>`;
  }

 for (let day = 1; day <= lastDate; day++) {
  const dateString =
    `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

  const dayRecords = records.filter(r => r.date === dateString);

  const animals = [...new Set(
    dayRecords.map(r => (r.animalCategory || "🦦 ラッコ").split(" ")[0])
  )].join("");

  html += `
    <div onclick="showRecordsForDate('${dateString}')" style="
      padding:8px 2px;
      min-height:52px;
      border-radius:10px;
      background:${dayRecords.length ? "#d8f4f6" : "#eef9fa"};
      font-weight:${dayRecords.length ? "700" : "400"};
    ">
      <div>${day}</div>
      ${dayRecords.length ? `<div style="font-size:16px;">${animals}</div>` : ""}
    </div>
  `;
 }

  html += `</div>`;
  calendar.innerHTML = html;
}
function showRecordsForDate(dateString) {
  const recordsArea = document.getElementById("records");

  const selectedRecords = window.currentRecords.filter(
    r => r.date === dateString
  );

  if (!selectedRecords.length) {
    recordsArea.innerHTML = `
      <div id="empty">
        ${dateString} の記録はまだないよ🦦
      </div>
    `;
    return;
  }
   recordsArea.innerHTML = selectedRecords.map(r => `
    <div class="record">
      <div class="name">🏝️ ${escapeHtml(r.aquarium)}</div>

      <div class="small">
        ${r.date || "日付なし"} ・
        ${escapeHtml(r.animalCategory || "🦦 ラッコ")}
        ${r.otterName ? "・ " + escapeHtml(r.otterName) : ""}
      </div>

      ${r.photo ? `
        <img
          src="${r.photo}"
          alt="思い出の写真"
          style="width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-top:10px;"
        >
      ` : ""}

      ${r.photoOtterName ? `
        <div style="font-weight:700;margin-top:7px;">
          🦦 この写真：${escapeHtml(r.photoOtterName)}
        </div>
      ` : ""}

      ${r.memo ? `<p>${escapeHtml(r.memo)}</p>` : ""}
    </div>
  `).join("");
}
 
function addRecord() {
  const aquarium = document.getElementById("aquarium").value.trim();
  const date = document.getElementById("date").value;
  const animalCategory = document.getElementById("animalCategory").value;
  const otterName = document.getElementById("otterName").value.trim();
  const memo = document.getElementById("memo").value.trim();
  const photoFile = document.getElementById("photo").files[0];
  const photoOtterName = document.getElementById("photoOtterName").value.trim();

  if (!aquarium) {
    alert("水族館名を入れてね🦦");
    return;
  }

  const save = async (photo) => {
  try {
  await window.saveRecordToFirestore({
    aquarium,
    date,
    animalCategory,
    otterName,
    memo,
    photo,
    photoOtterName
  });
} catch (error) {
  console.error("Firestore保存エラー:", error);
  alert("☁️ クラウド保存に失敗しました：" + error.message);
  return;
  }
    document.getElementById("aquarium").value = "";
    document.getElementById("date").value = "";
    document.getElementById("animalCategory").value = "🦦 ラッコ";
    document.getElementById("otterName").value = "";
    document.getElementById("photo").value = "";
    document.getElementById("photoOtterName").value = "";
    document.getElementById("memo").value = "";

    await render();
  };

  if (photoFile) {
  const reader = new FileReader();

  reader.onload = () => {
    const img = new Image();

    img.onload = () => {
      const maxSize = 1000;
      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {
        height = Math.round(height * maxSize / width);
        width = maxSize;
      } else if (height > maxSize) {
        width = Math.round(width * maxSize / height);
        height = maxSize;
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);

      const compressedPhoto = canvas.toDataURL("image/jpeg", 0.7);
      save(compressedPhoto);
    };

    img.src = reader.result;
  };

  reader.readAsDataURL(photoFile);
} else {
  save("");
  }
}

async function deleteRecord(index) {
  const records = await window.loadRecordsFromFirestore();
  const record = records[index];

  if (!record) return;

  if (!confirm("この記録をクラウドから削除する？🦦🗑️")) {
    return;
  }

  try {
    await window.deleteRecordFromFirestore(record.id);
    await render();
    alert("🗑️ クラウドから記録を削除したよ！");
  } catch (error) {
    console.error("削除エラー:", error);
    alert("削除に失敗しました：" + error.message);
  }
}

 async function editRecord(index) {
  const records = await window.loadRecordsFromFirestore();
  const r = records[index];

  const modal = document.createElement("div");
  modal.style.cssText = `
    position:fixed; inset:0; background:#0008; z-index:9999;
    display:flex; align-items:center; justify-content:center; padding:18px;
  `;

  modal.innerHTML = `
    <div style="background:white;width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:22px;padding:20px;box-shadow:0 8px 30px #0004;">
      <h2 style="margin:0 0 14px;">✏️ 記録を編集</h2>

      <label style="font-weight:700;">🏝️ 水族館名</label>
      <input id="editAquarium" value="${escapeAttr(r.aquarium)}">

      <label style="font-weight:700;">📅 行った日</label>
      <input id="editDate" type="date" value="${escapeAttr(r.date || "")}">

      <label style="font-weight:700;">🐾 動物</label>
      <select id="editAnimalCategory" style="width:100%;border:1px solid #c9e8eb;border-radius:12px;padding:12px;margin:7px 0;font-size:16px;">
        <option value="🦦 ラッコ">🦦 ラッコ</option>
        <option value="🐧 ペンギン">🐧 ペンギン</option>
        <option value="🦭 アザラシ">🦭 アザラシ</option>
        <option value="🦣 セイウチ">🦣 セイウチ</option>
        <option value="🦫 ビーバー">🦫 ビーバー</option>
        <option value="🐬 イルカ">🐬 イルカ</option>
        <option value="🐋 クジラ">🐋 クジラ</option>
        <option value="🦈 サメ">🦈 サメ</option>
        <option value="🐢 カメ">🐢 カメ</option>
        <option value="🐙 タコ">🐙 タコ</option>
        <option value="🐠 魚">🐠 魚</option>
        <option value="🐾 その他">🐾 その他</option>
      </select>
      <label style="font-weight:700;">🦦 個体名</label>
      <input id="editOtter" value="${escapeAttr(r.otterName || "")}" placeholder="例：メイちゃん、44ちゃん">

      <label style="font-weight:700;">📸 写真</label>
      ${r.photo ? `<img id="editPreview" src="${r.photo}" style="width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin:8px 0;">`
                : `<div id="editPreview" style="padding:22px;text-align:center;background:#eef9fa;border-radius:14px;margin:8px 0;color:#6c9095;">写真なし</div>`}

      <input id="editPhoto" type="file" accept="image/*" style="display:none;">

      <div style="display:flex;gap:8px;margin:8px 0;">
        <button id="changePhoto" type="button" style="margin:0;">📸 写真を変更</button>
        <button id="deletePhoto" type="button" class="secondary" style="margin:0;">🗑️ 写真を削除</button>
      </div>

      <label style="font-weight:700;">🦦 この写真のラッコ</label>
      <input id="editPhotoOtter" value="${escapeAttr(r.photoOtterName || "")}" placeholder="例：メイちゃん">

      <label style="font-weight:700;">💭 思い出・感想</label>
      <textarea id="editMemo">${escapeHtml(r.memo || "")}</textarea>

      <div style="display:flex;gap:8px;">
        <button id="saveEdit" type="button" style="margin:0;">保存する 💾</button>
        <button id="cancelEdit" type="button" class="secondary" style="margin:0;">キャンセル</button>
      </div>
    </div>
  `;

  document.body.appendChild(modal);

  const categorySelect = modal.querySelector("#editAnimalCategory");
  categorySelect.value = r.animalCategory || "🦦 ラッコ";

  let editedPhoto = r.photo || "";

  const photoInput = modal.querySelector("#editPhoto");
  const preview = modal.querySelector("#editPreview");

  modal.querySelector("#changePhoto").onclick = () => photoInput.click();

  photoInput.onchange = () => {
  const file = photoInput.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    const img = new Image();

    img.onload = () => {
      const maxSize = 1000;
      let width = img.width;
      let height = img.height;

      if (width > height && width > maxSize) {
        height = Math.round(height * maxSize / width);
        width = maxSize;
      } else if (height > maxSize) {
        width = Math.round(width * maxSize / height);
        height = maxSize;
      }

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext("2d");

      editedPhoto = canvas.toDataURL("image/jpeg", 0.7);

      const currentPreview = modal.querySelector("#editPreview");

  };

  reader.readAsDataURL(file);
};

  modal.querySelector("#deletePhoto").onclick = () => {
    editedPhoto = "";
    const currentPreview = modal.querySelector("#editPreview");
    currentPreview.outerHTML = `<div id="editPreview" style="padding:22px;text-align:center;background:#eef9fa;border-radius:14px;margin:8px 0;color:#6c9095;">写真なし</div>`;
    photoInput.value = "";
  };

  modal.querySelector("#cancelEdit").onclick = () => modal.remove();

  modal.querySelector("#saveEdit").onclick = async () => {
   
    const aquarium = modal.querySelector("#editAquarium").value.trim();
    if (!aquarium) {
      alert("水族館名を入れてね🦦");
      return;
    }

    records[index] = {
      ...r,
      aquarium,
      date: modal.querySelector("#editDate").value,
      animalCategory: modal.querySelector("#editAnimalCategory").value,
      otterName: modal.querySelector("#editOtter").value.trim(),
      photoOtterName: modal.querySelector("#editPhotoOtter").value.trim(),
      memo: modal.querySelector("#editMemo").value.trim(),
      photo: editedPhoto
    };

    await window.updateRecordInFirestore(r.id, records[index]);
    modal.remove();
    await render();
  };
}

function escapeAttr(text) {
  return String(text).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function clearRecords() {
  if (!confirm("本当にクラウドの記録を全部消す？🦦🗑️\nこの操作は元に戻せないよ！")) {
    return;
  }

  try {
    await window.deleteAllRecordsFromFirestore();
    await render();
    alert("🗑️ クラウドの記録を全部削除したよ！");
  } catch (error) {
    console.error("全削除エラー:", error);
    alert("削除に失敗しました：" + error.message);
  }
}

async function render() {
 const records = await window.loadRecordsFromFirestore();

 window.currentRecords = records;
 drawCalendar(records);
 
 const area = document.getElementById("records");

  if (!records.length) {
    area.innerHTML = '<div id="empty">まだ記録がないよ。<br>最初のラッコ旅を記録しよう！🦦💕</div>';
    return;
  }

  area.innerHTML = records.map((r, i) => `
    <div class="record">
      <div class="name">🏝️ ${escapeHtml(r.aquarium)}</div>
      <div class="small">${r.date || "日付なし"} ・ ${escapeHtml(r.animalCategory || "🦦 ラッコ")} ${r.otterName ? "・ " + escapeHtml(r.otterName) : ""}</div>
      ${r.photo ? `<img src="${r.photo}" alt="思い出の写真" style="width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-top:10px;">
        ${r.photoOtterName ? `<div style="font-weight:700;margin-top:7px;">🦦 この写真：${escapeHtml(r.photoOtterName)}</div>` : ""}` : ""}
      ${r.memo ? `<p>${escapeHtml(r.memo)}</p>` : ""}
      <button class="secondary" onclick="editRecord(${i})">✏️ この記録を編集</button>
      <button class="secondary" onclick="deleteRecord(${i})">この記録を削除</button>
    </div>
  `).join("");
}

function escapeHtml(text) {
  return text.replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

</script>

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const recordsCollection = collection(db, "records");
 alert("🐚 思い出を大切にしまう準備中…🦦💕");
  window.saveRecordToFirestore = async (record) => {
 alert("🦦 思い出をクラウドの海へお届け中〜！☁️🌊");
  await addDoc(recordsCollection, {
    ...record,
    createdAt: serverTimestamp()
  });
};
  window.loadRecordsFromFirestore = async () => {
  const q = query(recordsCollection, orderBy("createdAt", "desc"));
  const snapshot = await getDocs(q);

  return snapshot.docs.map(doc => ({
    id: doc.id,
    ...doc.data()
  }));
};
  
  window.deleteRecordFromFirestore = async (id) => {
  await deleteDoc(doc(db, "records", id));
};
  window.deleteAllRecordsFromFirestore = async () => {
  const snapshot = await getDocs(recordsCollection);

  for (const recordDoc of snapshot.docs) {
    await deleteDoc(doc(db, "records", recordDoc.id));
  }
};

  window.updateRecordInFirestore = async (id, record) => {
  await updateDoc(doc(db, "records", id), record);
};
  
window.testLoadFirestore = async () => {
  const records = await window.loadRecordsFromFirestore();
  alert(`🦦 クラウドの海から ${records.length}件の思い出を見つけたよ！🌊✨`);
};

const provider = new GoogleAuthProvider();
const loginBtn = document.getElementById("loginBtn");
const logoutBtn = document.getElementById("logoutBtn");
const userInfo = document.getElementById("userInfo");

loginBtn.addEventListener("click", async () => {
  try {
   alert("🦦 Googleログインをはじめるよ〜！🔐");
    await signInWithPopup(auth, provider);
   alert("🎉 ログインできたよ！水族館へようこそ〜🐠🦦💕");
  } catch (error) {
    console.error("ログインエラー:", error);
    alert("ログイン失敗：" + error.code + "\n" + error.message);
  }
});
  onAuthStateChanged(auth, (user) => {
  if (user) {
    userInfo.textContent = `${user.displayName || "ユーザー"}でログイン中`;
    loginBtn.style.display = "none";
    logoutBtn.style.display = "inline-block";
  render().catch(error => {
  alert("アルバム表示エラー：" + error.message);
  console.error(error);
});
  } else {
    userInfo.textContent = "";
    loginBtn.style.display = "inline-block";
    logoutBtn.style.display = "none";
   document.getElementById("records").innerHTML =
  '<div id="empty">ログインするとクラウドの思い出が見られるよ🦦☁️</div>';
  }
});

logoutBtn.addEventListener("click", async () => {
  await signOut(auth);
});
